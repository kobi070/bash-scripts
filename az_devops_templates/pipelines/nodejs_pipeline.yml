trigger:
  - main

variables:
  imageRepository: 'my-nodejs-app'
  dockerRegistryServiceConnection: 'MyDockerHub'

stages:
  - stage: Build
    jobs:
      - template: ../jobs/build_test_job.yml
        parameters:
          language: 'nodejs'
          buildSteps:
            - template: ../common/docker_build_push.yml
              parameters:
                imageRepository: $(imageRepository)
                dockerRegistryServiceConnection: $(dockerRegistryServiceConnection)

  - stage: DeployDev
    dependsOn: Build
    condition: succeeded()
    jobs:
      - template: ../jobs/deploy_k8s_job.yml
        parameters:
          environment: 'dev'
          kubernetesServiceConnection: 'MyK8sDev'
          helmChartPath: './charts/my-app'
          releaseName: 'my-app-dev'
          valueFile: './charts/my-app/values-dev.yaml'
